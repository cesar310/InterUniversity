<app-page-header
  [title]="'Gestión de Estudiantes'"
  [buttons]="headerButtons"
/>

<p-card>
  <div class="mb-4">
    <p-iconfield iconPosition="left">
      <p-inputicon styleClass="pi pi-search" />
      <input
        pInputText
        type="text"
        placeholder="Buscar estudiantes por nombre, código o correo..."
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
        class="w-full"
      />
    </p-iconfield>
  </div>

  <p-table
    [value]="filteredStudents()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} estudiantes"
    [rowsPerPageOptions]="[5, 10, 25]"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="studentName">
          <div class="flex items-center gap-2">
            Nombre
            <p-sortIcon field="studentName" />
          </div>
        </th>
        <th pSortableColumn="studentCode">
          <div class="flex items-center gap-2">
            Código
            <p-sortIcon field="studentCode" />
          </div>
        </th>
        <th pSortableColumn="email">
          <div class="flex items-center gap-2">
            Email
            <p-sortIcon field="email" />
          </div>
        </th>
        <th pSortableColumn="enrolledSubjects">
          <div class="flex items-center gap-2">
            Inscripciones
            <p-sortIcon field="enrolledSubjects" />
          </div>
        </th>
        <th pSortableColumn="maxAllowed">
          <div class="flex items-center gap-2">
            Máximo Permitido
            <p-sortIcon field="maxAllowed" />
          </div>
        </th>
        <th pSortableColumn="subjects">
          <div class="flex items-center gap-2">
            Materias
            <p-sortIcon field="subjects" />
          </div>
        </th>
        <th pSortableColumn="isActive">
          <div class="flex items-center gap-2">
            Estado
            <p-sortIcon field="isActive" />
          </div>
        </th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-student>
      <tr>
        <td>{{ student.studentName }}</td>
        <td>{{ student.studentCode }}</td>
        <td>{{ student.email }}</td>
        <td>{{ student.enrolledSubjects }}</td>
        <td>{{ student.maxAllowed }}</td>
        <td>{{ student.subjects || 'Ninguna' }}</td>
        <td>
          <p-tag
            [severity]="getStatusSeverity(student.isActive)"
            [value]="getStatusLabel(student.isActive)"
          />
        </td>
        <td>
          <div class="flex gap-2">
            <p-button
              icon="pi pi-eye"
              severity="info"
              [text]="true"
              [rounded]="true"
              pTooltip="Ver detalle"
              tooltipPosition="top"
              (onClick)="viewStudent(student)"
            />
            <p-button
              icon="pi pi-pencil"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              pTooltip="Editar"
              tooltipPosition="top"
              (onClick)="editStudent(student)"
            />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              [rounded]="true"
              pTooltip="Eliminar"
              tooltipPosition="top"
              (onClick)="deleteStudent(student)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8" class="text-center py-4">
          No se encontraron estudiantes
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<app-student-form
  [visible]="showFormDialog()"
  [student]="selectedStudent()"
  (onClose)="onFormClose()"
  (onSuccess)="onFormSuccess()"
/>

<p-confirmDialog />
