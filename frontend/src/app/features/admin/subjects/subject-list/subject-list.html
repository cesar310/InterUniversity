<app-page-header
  [title]="'Gestión de Materias'"
  [buttons]="headerButtons"
/>

<p-card>
  <!-- Filters -->
  <div class="flex flex-col md:flex-row gap-4 mb-4">
    <div class="flex-1">
      <p-iconfield iconPosition="left">
        <p-inputicon styleClass="pi pi-search" />
        <input
          pInputText
          type="text"
          placeholder="Buscar por nombre..."
          (input)="onSearch($event)"
          class="w-full"
        />
      </p-iconfield>
    </div>
    <div class="w-full md:w-64">
      <p-select
        [options]="statusOptions"
        [(ngModel)]="selectedStatus"
        optionLabel="label"
        optionValue="value"
        placeholder="Filtrar por estado"
        (onChange)="onFilter()"
      />
    </div>
    <div class="w-full md:w-64">
      <p-select
        [options]="professors()"
        [(ngModel)]="selectedProfessor"
        optionLabel="name"
        optionValue="id"
        placeholder="Filtrar por profesor"
        [showClear]="true"
        (onChange)="onFilter()"
        emptyMessage="No hay profesores disponibles"
      />
    </div>
  </div>

  <!-- Table -->
  <p-table
    [value]="subjects()"
    [lazy]="true"
    (onLazyLoad)="loadSubjects($event)"
    [paginator]="true"
    [rows]="10"
    [totalRecords]="pagination()?.totalItems || 0"
    [loading]="loading()"
    [(first)]="first"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} materias"
    [rowsPerPageOptions]="[5, 10, 25]"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name">
          <div class="flex items-center gap-2">
            Nombre
            <p-sortIcon field="name" />
          </div>
        </th>
        <th pSortableColumn="credits">
          <div class="flex items-center gap-2">
            Créditos
            <p-sortIcon field="credits" />
          </div>
        </th>
        <th pSortableColumn="professorName">
          <div class="flex items-center gap-2">
            Profesor
            <p-sortIcon field="professorName" />
          </div>
        </th>
        <th pSortableColumn="enrolledStudents">
          <div class="flex items-center gap-2">
            Inscritos
            <p-sortIcon field="enrolledStudents" />
          </div>
        </th>
        <th pSortableColumn="isActive">
          <div class="flex items-center gap-2">
            Estado
            <p-sortIcon field="isActive" />
          </div>
        </th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-subject>
      <tr>
        <td>{{ subject.name }}</td>
        <td>{{ subject.credits }}</td>
        <td>{{ subject.professorName }}</td>
        <td>
          <p-tag
            [value]="subject.enrolledStudents.toString()"
            [severity]="subject.enrolledStudents > 0 ? 'info' : 'secondary'"
          />
        </td>
        <td>
          <p-tag
            [value]="subject.isActive ? 'Activo' : 'Inactivo'"
            [severity]="subject.isActive ? 'success' : 'danger'"
          />
        </td>
        <td>
          <div class="flex gap-2">
            <p-button
              icon="pi pi-pencil"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              pTooltip="Editar"
              tooltipPosition="top"
              (onClick)="editSubject(subject)"
            />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              [rounded]="true"
              pTooltip="Eliminar"
              tooltipPosition="top"
              (onClick)="deleteSubject(subject)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center py-4">
          No se encontraron materias
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<app-subject-form
  [visible]="showFormDialog()"
  [subject]="selectedSubject()"
  (onClose)="onFormClose()"
  (onSuccess)="onFormSuccess()"
/>

<p-confirmDialog />
