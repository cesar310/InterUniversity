<div class="bg-surface-50 dark:bg-surface-950 px-6 py-20 md:px-20 lg:px-80">
    <div class="bg-surface-0 dark:bg-surface-900 p-8 md:p-12 shadow-sm rounded-2xl w-full max-w-sm mx-auto flex flex-col gap-8">
        <div class="flex flex-col items-center gap-4">
            <div class="flex items-center gap-4">
                <img src="/interu.webp" alt="Imagen" class="h-14 w-14" />
            </div>
            <div class="flex flex-col items-center gap-2 w-full">
                <div class="text-surface-900 dark:text-surface-0 text-2xl font-semibold leading-tight text-center w-full">Bienvenido a Inter University</div>
                <div class="text-center w-full">
                    <span class="text-surface-700 dark:text-surface-200 leading-normal">¿No tienes una cuenta?</span>
                    <a class="text-primary font-medium ml-1 cursor-pointer hover:text-primary-emphasis">¡Crea una hoy!</a>
                </div>
            </div>
        </div>
        <div class="flex flex-col gap-6 w-full">
            <div class="flex flex-col gap-2 w-full">
                <label for="email1" class="text-surface-900 dark:text-surface-0 font-medium leading-normal">Dirección de Correo Electrónico</label>
                <input pInputText id="email1" type="text" placeholder="Dirección de correo electrónico" class="w-full px-3 py-2 shadow-sm rounded-lg" />
            </div>
            <div class="flex flex-col gap-2 w-full">
                <label for="password1" class="text-surface-900 dark:text-surface-0 font-medium leading-normal">Contraseña</label>
                <input pInputText id="password1" type="password" placeholder="Contraseña" class="w-full px-3 py-2 shadow-sm rounded-lg" />
            </div>
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between w-full gap-3 sm:gap-0">
                <div class="flex items-center gap-2">
                    <p-checkbox id="rememberme1" [(ngModel)]="checked1" [binary]="true"></p-checkbox>
                    <label for="rememberme1" class="text-surface-900 dark:text-surface-0 leading-normal">Recuérdame</label>
                </div>
                <a class="text-primary font-medium cursor-pointer hover:text-primary-emphasis">¿Olvidaste tu contraseña?</a>
            </div>
        </div>
        <button pButton class="w-full py-2 rounded-lg flex justify-center items-center gap-2">
            <i pButtonIcon class="pi pi-user text-base! leading-normal!"></i>
            <span pButtonLabel>Iniciar Sesión</span>
        </button>
    </div>
</div>
